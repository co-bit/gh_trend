name: Daily Trend Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-trend-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4のデフォルト persist-credentials: true が
      # 「Commit and push updates」ステップのgit pushに必要(明示的にfalseに
      # 変更しないこと)。
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Discover new repositories
        run: python scripts/discover.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect daily signals
        run: python scripts/collect.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # data/latest_scores.json・docs/index.htmlは常にsource(data/repos/*・
      # watchlist.json・descriptions.json)から再計算される派生ファイル。
      # 先に生データだけをコミットしてからpullし、スコア計算・レンダリングは
      # pull後の最新状態に対して行うことで、派生ファイル同士のマージ
      # コンフリクトを構造的に発生させない(コンフリクトさせず、作り直す)。
      - name: Commit collected signals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/watchlist.json data/repos/
          git diff --staged --quiet || git commit -m "chore: シグナル収集 $(date -u +%Y-%m-%d)"

      - name: Sync with remote before computing derived output
        run: git pull --rebase origin main

      - name: Compute scores
        run: python scripts/score.py

      # 上位20件に新しく入ったリポジトリの日本語概要のみを生成する。
      # GEMINI_API_KEYが未設定なら何もせず正常終了するため、鍵の登録前でも
      # パイプラインは止まらない。
      - name: Generate Japanese descriptions
        run: python scripts/describe.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Render dashboard
        run: python scripts/render.py

      - name: Commit and push updates
        run: |
          git add data/ docs/
          git diff --staged --quiet || git commit -m "chore: 日次トレンド更新 $(date -u +%Y-%m-%d)"
          git push
